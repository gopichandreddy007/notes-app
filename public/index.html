<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📝 My Notes</h1>
  </header>

  <main>
    <section class="form-box">
      <h2 id="form-heading">Add a new note</h2>
      <form id="note-form">
        <input type="text" id="title" placeholder="Title" maxlength="100">
        <textarea id="content" rows="5" placeholder="Write your note here..."></textarea>
        <p id="error" class="error"></p>
        <div class="form-buttons">
          <button type="submit" id="save-btn">Add Note</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section>
      <input type="text" id="search" placeholder="🔍 Search notes...">
      <p id="count"></p>
      <div id="notes-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
